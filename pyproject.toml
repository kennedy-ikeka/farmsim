[project]
name = "simulations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.38.0",
    "google-api-core>=2.44.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pingouin>=0.7.0",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "pypdf>=7.0.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "simpy>=4.1.2",
    "streamlit>=1.67.0",
    "uuid>=1.30",
]

[project.scripts]
simulations = "simulations:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

markers = [
    "only: mark test to be run exclusively"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "watchfiles>=1.2.0",
]
